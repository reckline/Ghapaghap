    <script>
        /** * PROPER LOGIC: Intersection Observer
         * This script detects which video is currently in the center of the screen
         * and plays it, while pausing all other videos.
         */
        const options = {
            root: null, // use the viewport
            rootMargin: '0px',
            threshold: 0.7 // video must be 70% visible to play
        };

        const handleVideo = (entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        };

        const observer = new IntersectionObserver(handleVideo, options);

        // Apply observer to all short cards
        document.querySelectorAll('.short-card').forEach(card => {
            observer.observe(card);
        });

        // Toggle Sound on Click
        document.querySelectorAll('.video-wrapper').forEach(wrapper => {
            wrapper.addEventListener('click', () => {
                const video = wrapper.querySelector('video');
                video.muted = !video.muted;
            });
        });
    </script>

    <script>
        // 1. Select all videos
const allVideos = document.querySelectorAll('.short-video');

allVideos.forEach(video => {
    // 2. Listen for time updates
    video.addEventListener('timeupdate', () => {
        // Find the progress bar that belongs to THIS specific video's parent container
        const progressBar = video.parentElement.querySelector('.progress-bar');
        
        if (progressBar && video.duration) {
            // 3. Calculate percentage: (Current Time / Total Duration) * 100
            const percentage = (video.currentTime / video.duration) * 100;
            
            // 4. Update the CSS width
            progressBar.style.width = `${percentage}%`;
        }
    });
});
    </script>
        <script>
        const sidebar = document.getElementById('mobile-sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            
            if (isClosed) {
                // Open Sidebar
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    overlay.classList.add('opacity-100');
                    overlay.classList.add('pointer-events-auto');
                }, 10);
            } else {
                // Close Sidebar
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                overlay.classList.remove('pointer-events-auto');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            }
        }

        // Close sidebar if user clicks on overlay
        overlay.addEventListener('click', toggleSidebar);
    </script>
